[package]
org = "evento-globolo"
name = "evgl-sidecar"
version = "0.1.0"
description = "k8s sidecar for Evento Globolo."
license = "MIT"
keywords = ["sidecar", "observability", "k8s"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/evento-globolo/evgl-sidecar.rs"

[dependencies]
"ores-otel/ores-otel-sidecar" = "^0.1.0"

[build]
command = "cargo build --release --locked --bin evgl-sidecar"
outputs = ["target/release/evgl-sidecar"]

[bin]
evgl-sidecar = "target/release/evgl-sidecar"

[install]
adapter = "none"

[scripts]
test = "cargo test --all-targets --locked"
